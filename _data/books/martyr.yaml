- text: Like in Iran, there are these schools for the children of men killed in the war, who they call ‘martyrs.’ Those martyr schools are the good schools, the fancy schools, you try to get your kids into them. Kids with healthy parents grow up jealous of orphans, because the children of martyrs get automatic college admission, all this special treatment. I’ve heard of children of martyrs trying to hide it, like they’re ashamed of all the privilege. Like trust fund kids, except instead of trust funds they have dead parents. It’s nuts.”

- text: You wrote a fact in a book and there it sat until someone born five hundred years later improved it. Refined it, implemented it more usefully. Easy. You couldn’t do that with soul-learning. We all started from zero. From less than zero, actually. We started whiny, without grace. Obsessed only with our own needing. And the dead couldn’t teach us anything about that. No facts or tables or proofs. You just had to live and suffer and then teach your kids to do the same.

