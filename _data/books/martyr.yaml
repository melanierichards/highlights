- text: The performance of certainty seemed to be at the root of so much grief. Everyone in America seemed to be afraid and hurting and angry, starving for a fight they could win. And more than that even, they seemed certain their natural state was to be happy, contented, and rich. The genesis of everyone’s pain had to be external, such was their certainty. And so legislators legislated, building border walls, barring citizens of there from entering here. “The pain we feel comes from them, not ourselves,” said the banners, and people cheered, certain of all the certainty. But the next day they’d wake up and find that what had hurt in them still hurt.

