- text: Eventually what I picked was one of my newest pieces, something I’d been working on for weeks. Since then I’ve realized this was inevitable. Every time I finish something, still, I am certain it’s the best thing I’ve ever made, that everything else was the useful but disposable compost preparing my living for the masterpiece I’ve just wrought. Painting saved me, but I can’t say I loved painting. I painted because I needed to. What I really loved, what I love, is having-painted. That was the high. Making something that would never have existed in the entirety of humanity had I not been there at that specific moment to make it.

- text: Yes, the sheer dumb luck, as many have said, as I’ve said myself. To get such a chance from a gallery, even a small one, is one in a million. To catch the attention of a Times critic as a nobody, with no connections, no experience. Impossible. Except when Sang asked me to show her a painting, I had one. When she’d asked to see the paintings in my apartment, I had dozens. I’d worked my whole life to acquire the technical, the emotional skills to make those paintings. I’d chopped tomatoes and peeled half-eaten onion rings off plastic trays for thousands of hours. I’d painted in grief, weeping and painting, painting and weeping. There were probably weeks, whole months when I did not smile even once. I lived in a studio so small I could smell my neighbor’s farts. I spent every penny I had on canvas, brushes, paints. I killed myself. I killed my love. I forced myself to forget my husband, my brother. My country. My son. It’s easy for people who have sacrificed nothing to rationalize their own ordinariness by calling me lucky. But I sacrificed my entire life; I sold it to the abyss. And the abyss gave me art

- text: What I want to say is that I was happy. Not always, not even mostly. But I did know real, deep joy. Maybe everyone gets a certain amount to use up over a lifetime, and I just used my lifetime’s allotment especially quickly, with Leila. But I don’t think it was a tragedy, my life. Tragedies are relentless. Nobody could ask for more than what I’ve had.

- text: "“Without you” was everywhere apparent, even if Sang hadn’t said it out loud. His mother had not been shot out of the sky at all. Some random other woman—Leila, was it?—had been. Cyrus’s mother was another one of those just-stepping-out-for-a-pack-of-cigs family abandoners. He’d been a tiny baby. It felt so pulverizingly mundane. Roya Shams, the deadbeat mom. Or at least, she’d planned to be a deadbeat, before her lover—her lover!—Leila!!—was shot out of the sky. Cyrus felt annihilated. Furious. He felt angry for his sweet sick dead father. He felt angry for himself. Then at himself, for feeling angry instead of something more enlightened: acceptance, or perhaps compassion. That’s where he quickly settled, the vector of his rage, his hurt, pointed directly back at himself."

- text: Fear made me work hard, get better. It’s a dirty fuel, but it works. And anger? Anger helped me to leave him. To get my boys away from him as soon as I could. To come thrive in this country that didn’t even believe we were people. To prove it wrong. You can put a saddle on anger, Cyrus.”

- text: Cyrus once read an anthropologist who wrote about how the first artifact of civilization wasn’t a hammer or arrowhead, but a human femur—discovered in Madagascar—that showed signs of having healed from a bad fracture. In the animal world, a broken leg meant you starved, so a healed femur meant that some human had supported another’s long recovery, fed them, cleaned the wound. And thus, the author argued, began civilization. Augured not by an instrument of murder, but by a fracture bound, a bit of food brought back for another. It was an attractive idea.

- text: For our species, the idea of art as ornament is a relatively new one. Our ape brains got too big, too big for our heads, too big for our mothers to birth them. So we started keeping all our extra knowing in language, in art, in stories and books and songs. Art was a way of storing our brains in each other’s. It wasn’t until fairly recently in human history, when rich landowners wanted something pretty to look at in winter, that the idea of art-as-mere-ornament came around. A painting of a blooming rose to hang on the mantel when the flowers outside the window had gone to ice. And still in the twenty-first century, it’s hard for folks to move past that. This idea that beauty is the horizon toward which all great art must march.

