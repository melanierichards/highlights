    All around them, the city’s skyline of desiccated towers blinked absently, some of them crumbling around their edges. The trees of Prospect Park had at some point shaken off the snow and erupted into bloom. Lavender buds, blue and yellow and crimson flowers Cyrus didn’t recognize.
    “Are you seeing this?” asked Zee, gesturing to the wilding world around them.
    “I am.” Cyrus nodded. “I think it’s maybe because of us.” His words weren’t moving quite in sync with his lips.
    “Of course you do!” Zee laughed. “You’re not wrong, though.” His hands were cupped in front of him on his lap. “You’re not wrong.”

- text: "Finishing the article, Cyrus found himself praying, suddenly, without even realizing it. Sitting back down on a bench he was forming a prayer not exactly in language, not out loud at all. The most basic form of prayer, he’d heard once, was something like “help me help me help me, please please please, thank you thank you thank you”; and Cyrus’s prayer in the park was not much more advanced than that. But it was a prayer all the same, recognizable—like an Archimedian scale—by the heft of what it displaced. What formed in Cyrus’s mind was a blunt and inarticulable plea to be done, for a reprieve from navigating what had become to him an unnavigable world, to not have to spend the next decade or decades unraveling what it all meant, had meant, would mean. The anger he felt at his mother. The vanished. The abandoner. But, also, the pride he felt for her, now. The great artist. It was too much. He prayed for an end to the tyranny of all symbols, beginning with language. He understood, with a clarity that had until that moment in his life eluded him, that he was not at all made for the world in which he lived, that art and writing had gotten him only trivially closer to compensating for that fundamental defectiveness, the way standing on a roof gets one only trivially closer to grabbing the moon than standing in the dirt. Let me be done, he thought, this time in words, his mother’s letter still glowing on the screen in his hands. He closed his eyes, said it again out loud: “Let me be done.”"