- text: “Right. When people think about traveling to the past, they do it with this wild sense of self-importance. Like, ‘gosh, I better not step on that flower or my grandfather will never be born.’ But in the present we mow our lawns and poison ants and skip parties and miss birthdays all the time. We never think about the effects of that stuff.” Roya was working herself up. “Nobody thinks of now as the future past.” “It’s the same way with the future,” said Roya. “We plant a tree imagining our kids will play under it one day, or we go to some shitty business meeting because it might be the one where our boss singles us out for a promotion. Every tiny decision becomes mired with importance, and we’re immobilized.”

