    “They’d never be able to make this today,” Zee said about the episode in which a character claimed to have invented a gaydar after a member of the office was outed.
    “You don’t think so?”
    “No way. You think they could?”
    Cyrus thought for a second:
    “I guess not. But that’s the point, I think.”
    “What do you mean?” Zee asked.
    “Like you couldn’t make The Honeymooners or Cheers today either.”
    “Was Cheers the one with Archie Bunker?” Zee asked.
    “Nah, that was All in the Family. But that was fucked up too. That kind of comedy always exists on the edge of what you’re allowed to say at the moment. And that edge keeps moving. With the moment. The Everton window or whatever.”
    “Overton,” Zee said.
    “Huh?”
    “Overton window, not Everton.”
    “Oh, whatever,” Cyrus said, sucking his teeth. “But it’s everywhere. I’m constantly afraid to read the books I loved as a kid because I know there’s going to be some awful shit in there.”

