- text: I started using my diner money to buy oil paints, canvas, experimenting in my studio. Light washes of big colors, bold shapes. Then details. Playing with value, hue. Fat dark blues, arthritic grays. It was a place to put myself. The less time I spent in my higher brain, in the abyss, the safer I was. In New York, my papers said my name was Leila. Everyone called me my dead love’s name. The love I had killed when I died. Except I was still here, living inside her name. I was here, Ali and Cyrus were there, and Leila? Leila was nowhere. Here, there, nowhere. When I painted, I could be nowhere too

- text: "The handful of hours a week I wasn’t painting or working at the diner, I’d visit galleries. Obsessively. Always the little tiny ones in Chelsea, in the East Village. I wanted to see what everyone, absolutely everyone, was doing. Right then at that moment. Not the Met or the Frick. I knew well enough what the masters had made of things. I wanted to understand the visual vocabulary of the current moment, learn how to use all of it: textile art, neon sculpture, photography. Each felt like vital phrases within this new language that might allow me to communicate through—with?—the abyss. It was a way to stay on earth."

